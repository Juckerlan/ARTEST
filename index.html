<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Diorama AR</title>


    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <style>

        body {

            margin: 0;

            overflow: hidden;

        }

    </style>

</head>


<body>


    <a-scene

        mindar-image="imageTargetSrc: ./target.mind;"

        color-space="sRGB"

        renderer="colorManagement: true;"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- CÁMARA -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

        ></a-camera>


        <!-- TARGET -->

        <a-entity

            mindar-image-target="targetIndex: 0"

        >


            <!-- ========================= -->
            <!--          WILSON            -->
            <!-- ========================= -->

            <a-image

                src="./assets/wilson.png"

                position="0 0.45 0"

                rotation="90 0 0"

                width="0.55"

                height="0.8"

            ></a-image>


            <!-- ========================= -->
            <!--         CONGRATS           -->
            <!-- ========================= -->

            <a-image

                src="./assets/congrats.png"

                position="0 0.95 0"

                rotation="90 0 0"

                width="0.65"

                height="0.25"

            ></a-image>


        </a-entity>


    </a-scene>


</body>

</html>
